<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aleksandrs Zolotarjovs — Platform Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#0e1a33"/>
      <stop offset="1" stop-color="#0b1229"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .name { font: 700 44px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #f1f5f9; }
      .role { font: 500 21px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #7dd3fc; }
      .sub  { font: 400 15px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #94a3b8; }
      .mono { font: 500 13px 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #475569; }
    </style>
  </defs>

  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>
  <circle cx="840" cy="70" r="180" fill="url(#glow)"/>

  <!-- node graph: gpu / k8s cluster motif -->
  <g stroke="#334155" stroke-width="1.2" stroke-linecap="round">
    <line x1="700" y1="80" x2="790" y2="50"/>
    <line x1="700" y1="80" x2="780" y2="130"/>
    <line x1="790" y1="50" x2="880" y2="90"/>
    <line x1="700" y1="80" x2="880" y2="90"/>
    <line x1="780" y1="130" x2="880" y2="90"/>
    <line x1="780" y1="130" x2="850" y2="200"/>
    <line x1="880" y1="90" x2="940" y2="160"/>
    <line x1="850" y1="200" x2="940" y2="160"/>
    <line x1="700" y1="80" x2="640" y2="150"/>
    <line x1="640" y1="150" x2="780" y2="130"/>
  </g>

  <!-- relaxed signal: edges glow in sequence, a slow wave around the mesh -->
  <g stroke-width="2" stroke-linecap="round">
    <line x1="640" y1="150" x2="700" y2="80" stroke="#38bdf8" opacity="0">
      <animate attributeName="opacity" values="0;0.75;0;0" keyTimes="0;0.07;0.16;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1" dur="18s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="80" x2="790" y2="50" stroke="#7dd3fc" opacity="0">
      <animate attributeName="opacity" values="0;0.75;0;0" keyTimes="0;0.07;0.16;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1" dur="18s" begin="2s" repeatCount="indefinite"/>
    </line>
    <line x1="790" y1="50" x2="880" y2="90" stroke="#818cf8" opacity="0">
      <animate attributeName="opacity" values="0;0.75;0;0" keyTimes="0;0.07;0.16;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1" dur="18s" begin="4s" repeatCount="indefinite"/>
    </line>
    <line x1="880" y1="90" x2="700" y2="80" stroke="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0;0" keyTimes="0;0.07;0.16;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1" dur="18s" begin="6s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="80" x2="780" y2="130" stroke="#38bdf8" opacity="0">
      <animate attributeName="opacity" values="0;0.75;0;0" keyTimes="0;0.07;0.16;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1" dur="18s" begin="8s" repeatCount="indefinite"/>
    </line>
    <line x1="780" y1="130" x2="850" y2="200" stroke="#818cf8" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0;0" keyTimes="0;0.07;0.16;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1" dur="18s" begin="10s" repeatCount="indefinite"/>
    </line>
    <line x1="850" y1="200" x2="940" y2="160" stroke="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0;0" keyTimes="0;0.07;0.16;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1" dur="18s" begin="12s" repeatCount="indefinite"/>
    </line>
    <line x1="940" y1="160" x2="880" y2="90" stroke="#7dd3fc" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0;0" keyTimes="0;0.07;0.16;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1" dur="18s" begin="14s" repeatCount="indefinite"/>
    </line>
    <line x1="780" y1="130" x2="640" y2="150" stroke="#38bdf8" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0;0" keyTimes="0;0.07;0.16;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1" dur="18s" begin="16s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle cx="700" cy="80" r="7" fill="#38bdf8">
      <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="50" r="5" fill="#818cf8">
      <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="130" r="6" fill="#22d3ee">
      <animate attributeName="r" values="6;8;6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="90" r="8" fill="#38bdf8">
      <animate attributeName="r" values="8;10;8" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="200" r="5" fill="#818cf8">
      <animate attributeName="r" values="5;6.5;5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="160" r="6" fill="#22d3ee">
      <animate attributeName="r" values="6;7.5;6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="150" r="5" fill="#38bdf8">
      <animate attributeName="r" values="5;7;5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- text block -->
  <text x="56" y="108" class="name">Aleksandrs Zolotarjovs</text>
  <rect x="58" y="128" width="330" height="4" rx="2" fill="url(#accent)"/>

  <!-- rotating roles -->
  <g>
    <text x="56" y="172" class="role" opacity="0">
      Platform Engineer · Infrastructure Architect
      <animate attributeName="opacity" values="0;1;1;0;0;0;0" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="56" y="172" class="role" opacity="0">
      Kubernetes · GPU · LLM Infrastructure
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="56" y="172" class="role" opacity="0">
      Team Lead · Builder of 3D Web Things
      <animate attributeName="opacity" values="0;0;0;0;0;1;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="56" y="205" class="sub">15+ years shipping scalable cloud &amp; self-hosted platforms — Riga, Latvia</text>
  <text x="56" y="242" class="mono">$ kubectl get passions -o wide   #  k8s · gpu · llm · webxr · godot</text>
</svg>
